name: Delete image versions by tag

# One-off helper: drops the leftover bare `<version>` images that the release
# workflow used to build, so GHCR carries one manifest per version again.
# Run it from the Actions tab, then delete it.

on:
    workflow_dispatch:
        inputs:
            tags:
                description: Comma separated tags to delete
                required: true
                default: '5.0.0'
                type: string
            dry_run:
                description: Only list what would be deleted
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    packages: write

concurrency:
    group: registry-delete
    cancel-in-progress: false

jobs:
    delete:
        name: Delete the requested image versions
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            PACKAGE: microsoft-rewards-script
        steps:
            - name: Delete them
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAGS: ${{ inputs.tags }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
                  wanted=$(printf '%s' "${TAGS}" | tr -d ' ' | tr ',' '\n' | sed '/^$/d')
                  echo "Requested:"
                  echo "${wanted}" | sed 's/^/  /'

                  versions=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "${api}/versions?per_page=100&page=1")
                  deleted=0
                  while IFS=$'\t' read -r id tags; do
                      [ -n "${id}" ] || continue
                      match=false
                      while IFS= read -r want; do
                          [ -n "${want}" ] || continue
                          if printf '%s\n' "${tags}" | tr ',' '\n' | grep -Fxq -- "${want}"; then
                              match=true
                              break
                          fi
                      done <<<"${wanted}"
                      [ "${match}" = 'true' ] || continue
                      echo "  ${id} [${tags}]"
                      if [ "${DRY_RUN}" = 'true' ]; then
                          continue
                      fi
                      status=$(curl -sS -o /tmp/body -w '%{http_code}' -X DELETE \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' \
                          "${api}/versions/${id}")
                      echo "    delete -> HTTP ${status}"
                      if [ "${status}" = '204' ]; then
                          deleted=$((deleted + 1))
                      else
                          cat /tmp/body
                      fi
                  done < <(printf '%s' "${versions}" | jq -r '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv')
                  echo "Deleted ${deleted} version(s)."

            - name: Report the remaining tags
              if: always()
              run: |
                  set -uo pipefail
                  token=$(curl -sS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" |
                      jq -r '.token // empty')
                  if [ -n "${token}" ]; then
                      echo "GHCR tags now:"
                      curl -sS -H "Authorization: Bearer ${token}" \
                          "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/tags/list?n=200" |
                          jq -r '.tags // [] | .[]' | sort | sed 's/^/  /' || true
                  fi
