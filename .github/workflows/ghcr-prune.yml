name: Reset the container package

on:
    workflow_dispatch:
        inputs:
            step:
                description: What to run
                required: true
                default: 'private-then-delete'
                type: choice
                options:
                    - private-then-delete
                    - rebuild
            dry_run:
                description: Report the versions without deleting them
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    packages: write

env:
    PACKAGE: microsoft-rewards-script
    IMAGE: ghcr.io/${{ github.repository_owner }}/microsoft-rewards-script

jobs:
    reset:
        name: Reset the container package to 5.0.0
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Make the package private so its versions can be deleted
              if: inputs.step == 'private-then-delete'
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL:-https://api.github.com}"
                  for target in \
                      "${api}/user/packages/container/${PACKAGE}" \
                      "${api}/users/${OWNER}/packages/container/${PACKAGE}"; do
                      response="$(curl -sS -w '\n%{http_code}' -X PATCH \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'Content-Type: application/json' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' \
                          -d '{"visibility":"private"}' \
                          "$target")"
                      code="$(printf '%s' "$response" | tail -n1)"
                      body="$(printf '%s' "$response" | sed '$d')"
                      echo "PATCH ${target} -> HTTP ${code}"
                      printf '%s\n' "$body" | head -c 400
                      echo
                      if [ "$code" = '200' ] || [ "$code" = '204' ]; then
                          echo "visibility=private accepted by ${target}"
                          break
                      fi
                  done
            - name: Report the package and try a whole package delete
              if: inputs.step == 'private-then-delete'
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL:-https://api.github.com}"
                  for target in \
                      "${api}/user/packages/container/${PACKAGE}" \
                      "${api}/users/${OWNER}/packages/container/${PACKAGE}"; do
                      response="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$target")"
                      echo "GET ${target} -> HTTP $(printf '%s' "$response" | tail -n1)"
                      printf '%s' "$response" | sed '$d' | head -c 500
                      echo
                  done
                  response="$(curl -sS -w '\n%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${api}/user/packages/container/${PACKAGE}")"
                  echo "DELETE package -> HTTP $(printf '%s' "$response" | tail -n1)"
                  printf '%s' "$response" | sed '$d' | head -c 500
                  echo
            - name: Delete every version
              if: inputs.step == 'private-then-delete'
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL:-https://api.github.com}"
                  page=1
                  while [ "$page" -le 10 ]; do
                      url="${api}/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100&page=${page}"
                      response="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$url")"
                      code="$(printf '%s' "$response" | tail -n1)"
                      body="$(printf '%s' "$response" | sed '$d')"
                      echo "GET page=${page} -> HTTP ${code}"
                      if [ "$code" != '200' ]; then
                          printf '%s\n' "$body"
                          exit 1
                      fi
                      count="$(printf '%s' "$body" | jq 'length')"
                      echo "  versions on page: ${count}"
                      [ "$count" = '0' ] && break
                      printf '%s' "$body" | jq -c '.[] | {id, tags: (.metadata.container.tags // [])}' > versions.jsonl
                      while read -r item; do
                          id="$(printf '%s' "$item" | jq -r '.id')"
                          tags="$(printf '%s' "$item" | jq -r '.tags | join(",")')"
                          if [ "${DRY_RUN:-false}" = 'true' ]; then
                              echo "  would delete ${id} [${tags}]"
                              continue
                          fi
                          del="${api}/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
                          dresponse="$(curl -sS -w '\n%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$del")"
                          dcode="$(printf '%s' "$dresponse" | tail -n1)"
                          dbody="$(printf '%s' "$dresponse" | sed '$d')"
                          echo "  delete ${id} [${tags}] -> HTTP ${dcode}"
                          if [ "$dcode" != '204' ] && [ -n "$dbody" ]; then
                              printf '    %s\n' "$dbody"
                          fi
                      done < versions.jsonl
                      page=$((page + 1))
                  done
            - name: Check out the branch to rebuild from
              if: inputs.step == 'rebuild'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: v5
                  persist-credentials: false
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              if: inputs.step == 'rebuild'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              if: inputs.step == 'rebuild'
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              if: inputs.step == 'rebuild'
            - name: Publish 5.0.0 again
              if: inputs.step == 'rebuild'
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  set -euo pipefail
                  api="${GITHUB_API_URL:-https://api.github.com}"
                  response="$(curl -sS -w '\n%{http_code}' -X PATCH \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'Content-Type: application/json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      -d '{"visibility":"public"}' \
                      "${api}/users/${OWNER}/packages/container/${PACKAGE}")"
                  echo "PATCH visibility -> HTTP $(printf '%s' "$response" | tail -n1)"
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              if: inputs.step == 'rebuild'
              id: build
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  provenance: false
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/microsoft-rewards-script:5.0.0
                      ghcr.io/${{ github.repository_owner }}/microsoft-rewards-script:5
                  cache-from: type=gha,version=2,scope=dockerhub-v5
                  cache-to: type=gha,version=2,scope=dockerhub-v5,mode=max
            - name: Point latest at 5.0.0
              if: inputs.step == 'rebuild'
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  image="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
                  docker buildx imagetools create --tag "${image}:latest" "${image}@${DIGEST}"
                  docker buildx imagetools inspect "${image}:latest"
