name: Prune container versions

on:
    workflow_dispatch:
        inputs:
            keep:
                description: Comma separated tags that must survive
                required: false
                default: '5,5.0.0,latest'
                type: string
            latest_from:
                description: Tag whose digest latest should point at; empty skips
                required: false
                default: ''
                type: string
            dry_run:
                description: Report the versions without deleting them
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    packages: write

env:
    PACKAGE: microsoft-rewards-script
    IMAGE: ghcr.io/${{ github.repository_owner }}/microsoft-rewards-script

jobs:
    prune:
        name: Delete tagged versions outside the keep list
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Point latest at the requested tag
              if: inputs.latest_from != ''
              run: |
                  set -euo pipefail
                  image="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
                  docker buildx imagetools create --tag "${image}:latest" "${image}:${{ inputs.latest_from }}"
                  docker buildx imagetools inspect "${image}:latest"
            - name: List and delete
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
                  KEEP: ${{ inputs.keep }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL:-https://api.github.com}"
                  echo "keep=[${KEEP}] dry_run=${DRY_RUN} package=${PACKAGE} owner=${OWNER}"
                  page=1
                  while [ "$page" -le 10 ]; do
                      url="${api}/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100&page=${page}"
                      response="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$url")"
                      code="$(printf '%s' "$response" | tail -n1)"
                      body="$(printf '%s' "$response" | sed '$d')"
                      echo "GET page=${page} -> HTTP ${code}"
                      if [ "$code" != '200' ]; then
                          printf '%s\n' "$body"
                          exit 1
                      fi
                      count="$(printf '%s' "$body" | jq 'length')"
                      echo "  versions on page: ${count}"
                      [ "$count" = '0' ] && break
                      printf '%s' "$body" | jq -c '.[] | {id, tags: (.metadata.container.tags // [])}' > versions.jsonl
                      while read -r item; do
                          id="$(printf '%s' "$item" | jq -r '.id')"
                          tags="$(printf '%s' "$item" | jq -r '.tags | join(",")')"
                          # A version without tags is a platform manifest of an index that is
                          # still alive; deleting it would leave the index pointing at nothing.
                          if [ -z "$tags" ]; then
                              continue
                          fi
                          keep=false
                          IFS=',' read -ra wanted <<< "${KEEP}"
                          IFS=',' read -ra have <<< "${tags}"
                          for t in "${have[@]}"; do
                              for w in "${wanted[@]}"; do
                                  [ -n "$w" ] && [ "$t" = "$w" ] && keep=true
                              done
                          done
                          if [ "$keep" = 'true' ]; then
                              echo "  keep ${id} [${tags}]"
                              continue
                          fi
                          if [ "${DRY_RUN:-false}" = 'true' ]; then
                              echo "  would delete ${id} [${tags}]"
                              continue
                          fi
                          del="${api}/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
                          dcode="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$del")"
                          echo "  delete ${id} [${tags}] -> HTTP ${dcode}"
                      done < versions.jsonl
                      page=$((page + 1))
                  done
