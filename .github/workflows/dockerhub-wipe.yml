name: Wipe the Docker Hub tags

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    wipe:
        name: Delete every Docker Hub tag
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Delete the tags so the next publication starts at v5.0.0
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  image="changliuxian49/microsoft-rewards-script"
                  namespace="${image%%/*}"
                  repository="${image#*/}"
                  if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
                      echo "The Docker Hub credentials are unset." >&2
                      exit 1
                  fi
                  page=1
                  while [ "$page" -le 20 ]; do
                      url="https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags?page_size=100&page=${page}"
                      response="$(curl -sS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" "$url" || true)"
                      names="$(printf '%s' "$response" | jq -r '.results[]?.name' 2>/dev/null || true)"
                      if [ -z "$names" ]; then
                          echo "page ${page}: no tags"
                          break
                      fi
                      for name in $names; do
                          code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                              -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
                              "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/${name}/" || true)"
                          echo "delete ${name} -> HTTP ${code}"
                      done
                      page=$((page + 1))
                  done
                  remaining="$(curl -sS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
                      "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags?page_size=100" || true)"
                  echo "remaining: $(printf '%s' "$remaining" | jq -r '[.results[]?.name] | join(", ")')"
