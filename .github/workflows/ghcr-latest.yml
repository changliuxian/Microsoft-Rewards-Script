name: Point latest at the current release

on:
    workflow_dispatch:
        inputs:
            source_tag:
                description: Release tag to promote, for example v5.0.0. Empty uses the newest tag.
                required: false
                type: string

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io

jobs:
    latest:
        name: Tag the newest release as latest
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Resolve the image and source tag
              id: cfg
              env:
                  SOURCE_TAG: ${{ inputs.source_tag }}
              run: |
                  set -euo pipefail
                  image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
                  tag="${SOURCE_TAG:-}"
                  if [ -z "$tag" ]; then
                      tag="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1)"
                  fi
                  echo "image=${image}" >> "$GITHUB_ENV"
                  echo "source_tag=${tag#v}" >> "$GITHUB_ENV"
                  echo "Resolved ${image}:${tag#v}"
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Copy the release digest onto latest
              run: |
                  set -euo pipefail
                  docker buildx imagetools create --tag "${image}:latest" "${image}:${source_tag}"
                  docker buildx imagetools inspect "${image}:latest"
