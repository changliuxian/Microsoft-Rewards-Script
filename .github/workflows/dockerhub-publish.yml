name: Publish to Docker Hub

# Publishes the CN fork as a Docker image: after Upstream sync finishes (its own push
# cannot trigger a workflow), and on every human push to v5. The registry is the source
# of truth for the version counter, so the next tag is one past the highest v5.0.N tag
# already published and `latest` always moves to the newest one. A commit that is
# already published under its `sha-` tag is skipped, which makes re-runs harmless.

on:
    workflow_run:
        workflows: [Upstream sync]
        types: [completed]
    push:
        branches: [v5]
    workflow_dispatch:
        inputs:
            source_branch:
                description: Branch to build
                required: false
                default: v5
                type: string
            platforms:
                description: Comma-separated target platforms
                required: false
                default: linux/amd64,linux/arm64
                type: string
            dry_run:
                description: Build without pushing
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: dockerhub-publish
    cancel-in-progress: false

env:
    DOCKER_BUILD_RECORD_UPLOAD: 'false'
    DEFAULT_IMAGE: changliuxian49/microsoft-rewards-script

jobs:
    publish:
        name: Build and push the CN image
        runs-on: ubuntu-24.04
        # The arm64 half builds under emulation, so allow a generous ceiling.
        timeout-minutes: 120
        # A failed sync leaves v5 untouched, so there is nothing new to publish.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        steps:
            # `inputs` is not available in workflow-level env, so resolve it here.
            - name: Resolve settings
              id: cfg
              shell: bash
              env:
                  INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
                  INPUT_PLATFORMS: ${{ inputs.platforms }}
                  INPUT_DRY_RUN: ${{ inputs.dry_run }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  source_branch="${INPUT_SOURCE_BRANCH:-v5}"
                  platforms="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
                  dry_run="${INPUT_DRY_RUN:-false}"
                  image="${DEFAULT_IMAGE,,}"
                  configured=false
                  if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                      configured=true
                  else
                      echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are unset; the publication is skipped."
                  fi
                  {
                      echo "SOURCE_BRANCH=${source_branch}"
                      echo "PLATFORMS=${platforms}"
                      echo "DRY_RUN=${dry_run}"
                      echo "IMAGE=${image}"
                  } >> "$GITHUB_ENV"
                  {
                      echo "source_branch=${source_branch}"
                      echo "platforms=${platforms}"
                      echo "dry_run=${dry_run}"
                      echo "image=${image}"
                      echo "configured=${configured}"
                  } >> "$GITHUB_OUTPUT"

            - name: Check out the source branch
              if: steps.cfg.outputs.configured == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.cfg.outputs.source_branch }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Log in to Docker Hub
              if: steps.cfg.outputs.configured == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              if: steps.cfg.outputs.configured == 'true'
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  platforms: arm64

            - name: Set up Buildx
              if: steps.cfg.outputs.configured == 'true'
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Resolve the next version
              id: version
              if: steps.cfg.outputs.configured == 'true'
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  revision="$(git rev-parse HEAD)"
                  short="$(git rev-parse --short=7 HEAD)"
                  namespace="${IMAGE%%/*}"
                  repository="${IMAGE#*/}"

                  # The commit tag records what is already out: a second trigger for the
                  # same tree finds its own `sha-` tag and stops, so the version counter
                  # never advances twice for one commit.
                  if docker buildx imagetools inspect "${IMAGE}:sha-${short}" >/dev/null 2>&1; then
                      echo "${IMAGE}:sha-${short} already exists; nothing to publish."
                      echo "state=current" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  exists=false
                  if docker buildx imagetools inspect "${IMAGE}:latest" >/dev/null 2>&1; then
                      exists=true
                  fi

                  # The counter lives in the registry: the next version is one past the
                  # highest existing v5.0.N tag, so a fresh repository starts at v5.0.0.
                  auth=()
                  if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                      auth=(-u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}")
                  fi
                  highest=-1
                  queried=false
                  page=1
                  while [ "$page" -le 10 ]; do
                      response="$(
                          curl -fsS --max-time 30 "${auth[@]}" \
                              "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags?page_size=100&page=${page}" \
                              2>/dev/null || true
                      )"
                      if [ -z "$response" ]; then
                          break
                      fi
                      queried=true
                      highest="$(
                          printf '%s' "$response" \
                              | jq -r --argjson highest "$highest" '
                                  [.results[]?.name | select(test("^v5\\.0\\.[0-9]+$")) | sub("^v5\\.0\\."; "") | tonumber]
                                  + [$highest]
                                  | max
                              '
                      )"
                      next="$(printf '%s' "$response" | jq -r '.next // ""')"
                      if [ -z "$next" ] || [ "$next" = 'null' ]; then
                          break
                      fi
                      page=$((page + 1))
                  done

                  # Never restart the counter over existing tags: if the tag list cannot be
                  # read while the repository already has images, stop instead of guessing.
                  if [ "$queried" != 'true' ] && [ "$exists" = 'true' ]; then
                      echo "The Docker Hub tag list is unreadable but the repository has images; refusing to guess the version." >&2
                      echo "state=version-unknown" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  version="v5.0.$((highest + 1))"

                  {
                      echo "state=publish"
                      echo "revision=${revision}"
                      echo "short=${short}"
                      echo "version=${version}"
                  } >> "$GITHUB_OUTPUT"
                  if [ "$highest" -lt 0 ]; then
                      echo "No versioned tag exists yet; publishing ${version}."
                  else
                      echo "Highest published tag is v5.0.${highest}; publishing ${version}."
                  fi

            - name: Build and push the image
              id: build
              if: steps.version.outputs.state == 'publish'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: ${{ steps.cfg.outputs.dry_run != 'true' }}
                  platforms: ${{ steps.cfg.outputs.platforms }}
                  # Attestation manifests carry an unknown/unknown platform that older
                  # container runtimes on NAS devices refuse to pull.
                  provenance: false
                  tags: |
                      ${{ steps.cfg.outputs.image }}:${{ steps.version.outputs.version }}
                      ${{ steps.cfg.outputs.image }}:sha-${{ steps.version.outputs.short }}
                  cache-from: type=gha,version=2,scope=dockerhub-v5
                  cache-to: type=gha,version=2,scope=dockerhub-v5,mode=max
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

            - name: Point latest at the new version
              id: promote
              if: steps.version.outputs.state == 'publish' && steps.cfg.outputs.dry_run != 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
                  echo "${VERSION} is published and latest points at it."
                  echo "state=published" >> "$GITHUB_OUTPUT"

            - name: Summarise
              if: always()
              env:
                  STATE: ${{ steps.promote.outputs.state || steps.version.outputs.state }}
                  IMAGE_NAME: ${{ steps.cfg.outputs.image }}
                  CONFIGURED: ${{ steps.cfg.outputs.configured }}
                  VERSION: ${{ steps.version.outputs.version }}
                  SHORT: ${{ steps.version.outputs.short }}
                  TARGETS: ${{ steps.cfg.outputs.platforms }}
                  DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
              run: |
                  set -uo pipefail
                  state="${STATE:-unknown}"
                  if [ "${CONFIGURED:-false}" != 'true' ]; then
                      state="not-configured"
                  fi
                  {
                      echo "### Docker Hub publication"
                      echo
                      echo "| Field | Value |"
                      echo "| --- | --- |"
                      echo "| Image | \`${IMAGE_NAME:-?}\` |"
                      echo "| State | \`${state}\` |"
                      echo "| Version | \`${VERSION:-none}\` |"
                      echo "| Commit | \`${SHORT:-?}\` |"
                      echo "| Platforms | \`${TARGETS:-?}\` |"
                      echo "| Dry run | \`${DRY_RUN:-false}\` |"
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "Final state: ${state}"
