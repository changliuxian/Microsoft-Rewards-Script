name: Reset the image registries

# One-off helper: empties the GHCR package and every Docker Hub tag so the next
# publication starts again at v5.0.0. Run it from the Actions tab, then delete it.

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: Type reset to wipe every published image
                required: true
                type: string

permissions:
    contents: read
    packages: write

concurrency:
    group: registry-reset
    cancel-in-progress: false

jobs:
    reset:
        name: Empty GHCR and Docker Hub
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        if: github.event.inputs.confirm == 'reset'
        env:
            DOCKER_IMAGE: changliuxian49/microsoft-rewards-script
            PACKAGE: microsoft-rewards-script
        steps:
            - name: Delete the GHCR package
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -uo pipefail
                  api="${GITHUB_API_URL}/user/packages/container/${PACKAGE}"
                  status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "${api}")
                  echo "GHCR package delete -> HTTP ${status}"
                  case "${status}" in
                      204 | 404) echo "GHCR is empty." ;;
                      *)
                          echo "::error::GHCR package delete failed with HTTP ${status}."
                          exit 1
                          ;;
                  esac

            - name: Delete every Docker Hub tag
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
                      echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required."
                      exit 1
                  fi
                  namespace="${DOCKER_IMAGE%%/*}"
                  repository="${DOCKER_IMAGE#*/}"

                  jwt=$(printf '{"username":"%s","password":"%s"}' \
                      "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" |
                      curl -sS -X POST -H 'Content-Type: application/json' \
                          --data-binary @- 'https://hub.docker.com/v2/users/login/' |
                      jq -r '.token // empty')
                  if [ -z "${jwt}" ]; then
                      echo "::error::Docker Hub login failed."
                      exit 1
                  fi

                  tags=$(curl -sS -H "Authorization: JWT ${jwt}" \
                      "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/?page_size=100" |
                      jq -r '.results[]?.name // empty')
                  if [ -z "${tags}" ]; then
                      echo "Docker Hub is already empty."
                      exit 0
                  fi

                  echo "Tags to delete:"
                  echo "${tags}" | sed 's/^/  /'
                  failed=0
                  while IFS= read -r tag; do
                      [ -n "${tag}" ] || continue
                      status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                          -H "Authorization: JWT ${jwt}" \
                          "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/${tag}/")
                      echo "  ${tag} -> HTTP ${status}"
                      case "${status}" in
                          204 | 404) ;;
                          *) failed=$((failed + 1)) ;;
                      esac
                  done <<<"${tags}"

                  if [ "${failed}" -ne 0 ]; then
                      echo "::error::${failed} tag(s) could not be deleted."
                      exit 1
                  fi
                  echo "Docker Hub is empty."

            - name: Report the remaining tags
              if: always()
              run: |
                  set -uo pipefail
                  token=$(curl -sS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" |
                      jq -r '.token // empty')
                  if [ -n "${token}" ]; then
                      echo "GHCR tags after the reset:"
                      curl -sS -H "Authorization: Bearer ${token}" \
                          "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/tags/list?n=200" |
                          jq -r '.tags // [] | .[]' | sed 's/^/  /' || true
                  fi
