name: Promote v5 to main

# Publishes the synced CN fork to main: after Upstream sync finishes, and on every
# push to v5, this merges v5 into main and pushes the result. The merge is a no-op
# in the normal case — main then simply contains v5 — so the full check suite only
# runs when the merged tree really differs from v5. A conflict or a failing check
# stops the promotion without pushing and keeps one tracking issue open.

on:
    workflow_run:
        workflows: [Upstream sync]
        types: [completed]
    push:
        branches: [v5]
    workflow_dispatch:
        inputs:
            source_branch:
                description: Branch that carries the CN work
                required: false
                default: v5
                type: string
            target_branch:
                description: Branch to publish into
                required: false
                default: main
                type: string
            dry_run:
                description: Report only, never push
                required: false
                default: false
                type: boolean

permissions:
    contents: write
    issues: write

concurrency:
    group: promote-v5-to-main
    cancel-in-progress: false

env:
    ISSUE_LABEL: main-promotion
    GIT_EDITOR: 'true'

jobs:
    promote:
        name: Merge v5 into main
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        # A failed sync leaves v5 untouched, so there is nothing to promote.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        steps:
            # `inputs` is not available in workflow-level env, so resolve it here.
            - name: Resolve settings
              id: cfg
              shell: bash
              env:
                  INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
                  INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
                  INPUT_DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -euo pipefail
                  source_branch="${INPUT_SOURCE_BRANCH:-v5}"
                  target_branch="${INPUT_TARGET_BRANCH:-main}"
                  dry_run="${INPUT_DRY_RUN:-false}"
                  {
                      echo "SOURCE_BRANCH=${source_branch}"
                      echo "TARGET_BRANCH=${target_branch}"
                      echo "DRY_RUN=${dry_run}"
                      echo "ISSUE_TITLE=Promotion of ${source_branch} into ${target_branch} blocked"
                  } >> "$GITHUB_ENV"
                  echo "source_branch=${source_branch}" >> "$GITHUB_OUTPUT"
                  echo "target_branch=${target_branch}" >> "$GITHUB_OUTPUT"
                  echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
                  echo "Promoting ${source_branch} into ${target_branch} (dry_run=${dry_run})."

            # Credentials stay persisted so the push step can use them.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.cfg.outputs.source_branch }}
                  fetch-depth: 0

            - name: Merge the source branch
              id: merge
              shell: bash
              run: |
                  set -uo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  if ! git fetch --no-tags --prune origin \
                      "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
                      "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"; then
                      echo "state=fetch-failed" >> "$GITHUB_OUTPUT"
                      echo "Could not fetch the branches; skipping the promotion."
                      exit 0
                  fi
                  source_sha=$(git rev-parse "origin/${SOURCE_BRANCH}")
                  target_sha=$(git rev-parse "origin/${TARGET_BRANCH}")
                  echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
                  echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
                  echo "Source ${SOURCE_BRANCH} = ${source_sha}"
                  echo "Target ${TARGET_BRANCH} = ${target_sha}"

                  if ! base=$(git merge-base "origin/${SOURCE_BRANCH}" "origin/${TARGET_BRANCH}"); then
                      echo "state=unrelated" >> "$GITHUB_OUTPUT"
                      echo "The branches share no history; nothing to merge."
                      exit 0
                  fi
                  echo "base=${base}" >> "$GITHUB_OUTPUT"

                  read -r behind ahead < <(git rev-list --left-right --count "origin/${SOURCE_BRANCH}...origin/${TARGET_BRANCH}")
                  echo "behind=${behind}" >> "$GITHUB_OUTPUT"
                  echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
                  echo "${SOURCE_BRANCH} is ${behind} commit(s) ahead of ${TARGET_BRANCH}; ${TARGET_BRANCH} holds ${ahead} extra commit(s)."

                  git log --reverse --oneline "origin/${TARGET_BRANCH}..origin/${SOURCE_BRANCH}" > incoming.txt || true
                  git log --reverse --oneline "origin/${SOURCE_BRANCH}..origin/${TARGET_BRANCH}" > extra.txt || true

                  if [ "$behind" = "0" ]; then
                      echo "state=current" >> "$GITHUB_OUTPUT"
                      echo "${TARGET_BRANCH} already contains ${SOURCE_BRANCH}."
                      exit 0
                  fi

                  git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}" || {
                      echo "state=fetch-failed" >> "$GITHUB_OUTPUT"
                      echo "Could not check out ${TARGET_BRANCH}."
                      exit 0
                  }

                  if ! git merge --no-ff --no-edit "origin/${SOURCE_BRANCH}" \
                      -m "chore: promote ${SOURCE_BRANCH} into ${TARGET_BRANCH}" > merge.log 2>&1; then
                      echo "state=conflict" >> "$GITHUB_OUTPUT"
                      git diff --name-only --diff-filter=U > conflicted.txt || true
                      git status --short >> conflicted.txt || true
                      git merge --abort || true
                      echo "Merge conflicts on:"
                      cat conflicted.txt
                      exit 0
                  fi

                  # In the steady state main simply mirrors v5, so the merged tree is
                  # already verified and needs no rebuild.
                  if git diff --quiet "origin/${SOURCE_BRANCH}" HEAD; then
                      echo "state=identical" >> "$GITHUB_OUTPUT"
                      echo "The merged tree matches ${SOURCE_BRANCH}; no rebuild needed."
                  else
                      echo "state=diverged" >> "$GITHUB_OUTPUT"
                      git diff --stat "origin/${SOURCE_BRANCH}" HEAD > divergence.txt || true
                      echo "${TARGET_BRANCH} carries its own changes; the merged tree needs a check."
                  fi

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.merge.outputs.state == 'diverged'
              with:
                  node-version: 24
                  cache: npm

            - name: Verify the merged tree
              id: verify
              if: steps.merge.outputs.state == 'diverged'
              shell: bash
              run: |
                  set -uo pipefail
                  if npm ci --include=dev --ignore-scripts > install.log 2>&1 \
                      && npm run build > build.log 2>&1 \
                      && npm run check:api > api.log 2>&1 \
                      && npm run lint > lint.log 2>&1 \
                      && npm run format:check > format.log 2>&1; then
                      echo "state=verified" >> "$GITHUB_OUTPUT"
                      echo "The merged tree builds, lints and formats cleanly."
                      exit 0
                  fi
                  echo "state=broken" >> "$GITHUB_OUTPUT"
                  echo "The merged tree failed verification; nothing is pushed."
                  for log in install build api lint format; do
                      if [ -s "${log}.log" ]; then
                          echo "::group::${log}.log"
                          tail -n 40 "${log}.log"
                          echo "::endgroup::"
                      fi
                  done

            - name: Push the merge
              id: push
              if: (steps.merge.outputs.state == 'identical' || steps.verify.outputs.state == 'verified') && steps.cfg.outputs.dry_run != 'true'
              shell: bash
              run: |
                  set -uo pipefail
                  if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
                      echo "state=pushed" >> "$GITHUB_OUTPUT"
                      echo "Pushed ${SOURCE_BRANCH} into ${TARGET_BRANCH}."
                      exit 0
                  fi
                  echo "state=push-failed" >> "$GITHUB_OUTPUT"
                  echo "The merge could not be pushed; check branch protection on ${TARGET_BRANCH}."

            - name: Report to the tracking issue
              if: always() && steps.merge.outputs.state != ''
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MERGE_STATE: ${{ steps.merge.outputs.state }}
                  VERIFY_STATE: ${{ steps.verify.outputs.state }}
                  PUSH_STATE: ${{ steps.push.outputs.state }}
                  BEHIND: ${{ steps.merge.outputs.behind }}
                  AHEAD: ${{ steps.merge.outputs.ahead }}
                  BASE: ${{ steps.merge.outputs.base }}
                  SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
                  TARGET_SHA: ${{ steps.merge.outputs.target_sha }}
              run: |
                  set -euo pipefail
                  api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  curl_json() {
                      curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'Content-Type: application/json' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
                  }

                  state="${PUSH_STATE:-${VERIFY_STATE:-${MERGE_STATE}}}"
                  echo "Final state: ${state}"

                  curl_json -o /dev/null -X POST "${api}/labels" \
                      -d "{\"name\":\"${ISSUE_LABEL}\",\"color\":\"5319e7\",\"description\":\"v5 to main promotion needs a human\"}" \
                      || true

                  existing=$(curl_json "${api}/issues?labels=${ISSUE_LABEL}&state=open&per_page=100" \
                      | jq -r --arg title "${ISSUE_TITLE}" '.[] | select(.title == $title) | .number' \
                      | head -n 1) || true

                  case "${state}" in
                      current | pushed)
                          echo "Nothing to report (state=${state})."
                          if [ -n "${existing}" ]; then
                              curl_json -o /dev/null -X POST "${api}/issues/${existing}/comments" \
                                  -d "{\"body\":\"\`${TARGET_BRANCH}\` mirrors \`${SOURCE_BRANCH}\` again (state: \`${state}\`). Closing. [Run](${run_url})\"}"
                              curl_json -o /dev/null -X PATCH "${api}/issues/${existing}" -d '{"state":"closed"}'
                              echo "Closed issue #${existing}."
                          fi
                          exit 0
                          ;;
                  esac

                  {
                      echo "Publishing \`${SOURCE_BRANCH}\` into \`${TARGET_BRANCH}\` needs attention (state: \`${state}\`)."
                      echo
                      echo "| Field | Value |"
                      echo "| --- | --- |"
                      echo "| State | \`${state}\` |"
                      echo "| Source head | \`${SOURCE_SHA:-n/a}\` |"
                      echo "| Target head | \`${TARGET_SHA:-n/a}\` |"
                      echo "| Merge base | \`${BASE:-none}\` |"
                      echo "| Commits to publish | ${BEHIND:-?} |"
                      echo "| Target-only commits | ${AHEAD:-?} |"
                      echo "| Dry run | \`${DRY_RUN}\` |"
                      echo "| Run | [${GITHUB_RUN_ID}](${run_url}) |"
                      echo
                      case "${state}" in
                          conflict)
                              echo "**Conflicted paths**"
                              echo
                              echo '```'
                              head -n 80 conflicted.txt 2>/dev/null || echo '(none captured)'
                              echo '```'
                              echo
                              echo "\`${TARGET_BRANCH}\` carries changes that clash with \`${SOURCE_BRANCH}\`."
                              echo "Resolve the conflict locally, keep both intents, then push; the next run"
                              echo "promotes again."
                              echo
                              echo '```sh'
                              echo "git checkout ${TARGET_BRANCH} && git merge origin/${SOURCE_BRANCH}"
                              echo '```'
                              ;;
                          broken)
                              echo "**The merged tree does not build**"
                              echo
                              echo "The merge was clean, but the result fails a check, so nothing was pushed."
                              echo "The failing output is in the run log."
                              ;;
                          push-failed)
                              echo "**The merge could not be pushed**"
                              echo
                              echo "The merge verified cleanly, but pushing to \`${TARGET_BRANCH}\` was rejected."
                              echo "Check branch protection or the workflow token permissions."
                              ;;
                          unrelated)
                              echo "**No common history**"
                              echo
                              echo "\`${SOURCE_BRANCH}\` and \`${TARGET_BRANCH}\` share no ancestor."
                              ;;
                          fetch-failed)
                              echo "**The branches could not be fetched**"
                              echo
                              echo "The promotion was skipped."
                              ;;
                      esac
                      echo
                      echo "**Commits to publish**"
                      echo
                      echo '```'
                      head -n 40 incoming.txt 2>/dev/null || echo '(none)'
                      echo '```'
                      echo
                      echo "**Target-only commits**"
                      echo
                      echo '```'
                      head -n 40 extra.txt 2>/dev/null || echo '(none)'
                      echo '```'
                      echo
                      echo "This issue closes itself once a later run succeeds."
                  } > body.md

                  payload=$(jq -n --rawfile body body.md --arg title "${ISSUE_TITLE}" \
                      '{title: $title, body: $body, labels: [env.ISSUE_LABEL]}')
                  printf '%s' "${payload}" > payload.json

                  if [ -n "${existing}" ]; then
                      curl_json -o /dev/null -X PATCH "${api}/issues/${existing}" --data-binary @payload.json
                      echo "Updated issue #${existing}."
                  else
                      curl_json -o /dev/null -X POST "${api}/issues" --data-binary @payload.json
                      echo "Opened a new tracking issue."
                  fi

            - name: Summarise
              if: always()
              shell: bash
              env:
                  MERGE_STATE: ${{ steps.merge.outputs.state }}
                  VERIFY_STATE: ${{ steps.verify.outputs.state }}
                  PUSH_STATE: ${{ steps.push.outputs.state }}
                  SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
                  TARGET_SHA: ${{ steps.merge.outputs.target_sha }}
                  BEHIND: ${{ steps.merge.outputs.behind }}
                  AHEAD: ${{ steps.merge.outputs.ahead }}
              run: |
                  set -uo pipefail
                  {
                      echo "### Promotion"
                      echo
                      echo "| Field | Value |"
                      echo "| --- | --- |"
                      echo "| Merge | \`${MERGE_STATE:-unknown}\` |"
                      echo "| Verify | \`${VERIFY_STATE:-skipped}\` |"
                      echo "| Push | \`${PUSH_STATE:-skipped}\` |"
                      echo "| Source | \`${SOURCE_BRANCH:-?}\` @ \`${SOURCE_SHA:-n/a}\` |"
                      echo "| Target | \`${TARGET_BRANCH:-?}\` @ \`${TARGET_SHA:-n/a}\` |"
                      echo "| To publish / target-only | ${BEHIND:-0} / ${AHEAD:-0} |"
                      echo "| Dry run | \`${DRY_RUN:-false}\` |"
                  } >> "$GITHUB_STEP_SUMMARY"
